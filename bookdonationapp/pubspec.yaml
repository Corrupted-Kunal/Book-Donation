name: bookdonationapp
description: Book Donation App - Phase 1 scaffold
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2

  # Firebase (upgraded)
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_storage_web: ^3.11.0
  firebase_auth_web: ^6.1.0
  google_sign_in: ^6.1.0


  # State management
  flutter_riverpod: ^3.0.3

  # Navigation
  go_router: ^14.2.0

  # UI and utilities
  cached_network_image: ^3.2.3
  image_picker: ^1.1.0
  flutter_hooks: ^0.18.6
  intl: ^0.18.1
  uuid: ^4.5.2
  google_fonts: ^6.1.0
  permission_handler: ^11.3.0
  geolocator: ^11.1.0
  google_maps_flutter: ^2.9.0
  url_launcher: ^6.3.1
  file_picker: ^8.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

